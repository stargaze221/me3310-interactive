name: Build ME3310 real USC-HAD classifier features

on:
  push:
    paths:
      - 'motion-classifier/build_features.py'
      - '.github/workflows/usc-had-real-features.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-real-features:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific feature tools
        run: python -m pip install 'numpy>=2.0,<3' 'scipy>=1.14,<2'
      - name: Download USC-SIPI and extract REAL trial means
        run: python motion-classifier/build_features.py
      - name: Validate measured-data export
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("motion-classifier/data/usc_had_up_down_trials.json")
          d=json.loads(p.read_text(encoding="utf8"))
          assert len(d["rows"])==140
          assert len(set((r["subject"], r["trial"], r["classId"]) for r in d["rows"]))==140
          p2=pathlib.Path("motion-overfitting/data/usc_had_16_features.json")
          e=json.loads(p2.read_text(encoding="utf8"))
          assert e["originalTrialCount"]==140 and len(e["featureNames"])==16
          assert all(len(row["features"])==16 for row in e["rows"])
          assert [4,8,12,16]==e["fixedFeatureSets"]
          assert len(set((r["subject"],r["trial"],r["classId"]) for r in e["rows"]))==140
          assert all(abs(row["features"][0]-r["feature1"])<1e-12 for row,r in zip(e["rows"],d["rows"]))
          assert all(abs(row["features"][1]-r["feature2"])<1e-12 for row,r in zip(e["rows"],d["rows"]))
          print("Verified 140 genuine 16-feature trial vectors and identical first two features.")
          PY
      - name: Commit only derived features (not original raw archive)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add motion-classifier/data/usc_had_up_down_trials.json
          git add motion-overfitting/data/usc_had_16_features.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified USC-HAD original-trial feature summaries [skip ci]'
            git push
          fi
